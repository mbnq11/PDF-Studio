<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-body: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --accent-green: #34c759;
            --accent-red: #ff3b30;
            --radius-main: 20px;
            --radius-btn: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            max-width: 860px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .lang-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 980px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .app-container {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-main);
            padding: 18px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(52, 199, 89, 0.12);
            color: #1b8738;
            padding: 5px 12px;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 600;
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .upload-card {
            border: 2px dashed rgba(0, 113, 227, 0.28);
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 14px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .upload-card input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .active-file-card {
            display: none;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 8px;
        }

        .active-file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .file-icon {
            width: 34px;
            height: 34px;
            background: rgba(0, 113, 227, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-name {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 11.5px;
            color: var(--text-secondary);
        }

        .tabs-container {
            display: none;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            padding-bottom: 6px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 980px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
        }

        .tool-panel {
            display: none;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tool-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12.5px;
            font-weight: 600;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-btn);
            font-size: 13.5px;
            background: #ffffff;
            outline: none;
        }

        .btn-action {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            padding: 12px 16px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:disabled {
            background: #a1a1a6;
            cursor: not-allowed;
        }

        .btn-outline {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-danger {
            background: rgba(255, 59, 48, 0.1);
            color: var(--accent-red);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 12px;
            max-height: 320px;
            overflow-y: auto;
            padding: 2px;
        }

        .page-card {
            background: #fbfbfd;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            min-width: 0;
        }

        .page-card canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
            border-radius: 6px;
            background: #ffffff;
        }

        .page-card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 11.5px;
            font-weight: 600;
        }

        .comparison-card {
            display: none;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 12px;
            margin-top: 16px;
            width: 100%;
            overflow: hidden;
        }

        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .comparison-views {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            width: 100%;
        }

        .view-col {
            background: #fbfbfd;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .view-col h4 {
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .view-gallery {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 100%;
            max-width: 100%;
            padding: 4px 2px;
            justify-content: flex-start;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .view-gallery::-webkit-scrollbar {
            display: none;
        }

        .view-gallery .thumb-wrapper {
            flex: 0 0 85px;
            width: 85px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-gallery canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        .stats-badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.04);
            margin-top: 6px;
            word-break: break-all;
        }

        .download-group {
            display: flex;
            gap: 8px;
        }

        .footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 520px) {
            .app-container {
                padding: 14px 10px;
            }
            .comparison-views {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .view-gallery .thumb-wrapper {
                flex: 0 0 100px;
                width: 100px;
            }
            .download-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 700; font-size: 15px;">PDF Studio</div>
        <button class="lang-btn" id="langSwitch" onclick="toggleLanguage()">English</button>
    </div>

    <div class="app-container">
        <div class="title-section">
            <h1 id="appTitle">أدوات PDF</h1>
            <div class="security-badge" id="securityBadge">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                <span id="securityText">آمن، معالجة محلية بدون حفظ على السيرفر</span>
            </div>
        </div>

        <div class="upload-card" id="dropArea">
            <input type="file" id="fileInput" accept="application/pdf" />
            <div style="font-size: 14px; font-weight: 600;" id="uploadPrompt">اضغط أو اسحب ملف PDF هنا</div>
        </div>

        <div class="active-file-card" id="activeFileCard">
            <div class="active-file-info">
                <div class="file-icon">📄</div>
                <div style="min-width: 0; flex: 1;">
                    <div class="file-name" id="displayFileName">-</div>
                    <div class="file-meta" id="displayFileMeta">-</div>
                </div>
            </div>
            <button class="btn-danger" id="btnRemoveFile" onclick="resetFile()">حذف</button>
        </div>

        <div class="tabs-container" id="toolTabs">
            <button class="tab-btn active" data-tool="browse" onclick="setTool('browse')" id="tabBrowse">تصفح وحذف</button>
            <button class="tab-btn" data-tool="compress" onclick="setTool('compress')" id="tabCompress">ضغط</button>
            <button class="tab-btn" data-tool="watermark" onclick="setTool('watermark')" id="tabWatermark">علامة مائية</button>
            <button class="tab-btn" data-tool="rotate" onclick="setTool('rotate')" id="tabRotate">تدوير</button>
            <button class="tab-btn" data-tool="extract" onclick="setTool('extract')" id="tabExtract">استخراج</button>
            <button class="tab-btn" data-tool="numbers" onclick="setTool('numbers')" id="tabNumbers">ترقيم</button>
            <button class="tab-btn" data-tool="merge" onclick="setTool('merge')" id="tabMerge">دمج</button>
        </div>

        <div class="tool-panel active" id="panelBrowse">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label id="lblSelectPages">حدد الصفحات أو احذفها:</label>
                <button class="btn-action" style="width: auto; padding: 6px 12px; min-height: 32px; font-size: 12.5px;" onclick="saveBrowsedPdf()" id="btnSaveBrowsed">حفظ التغييرات</button>
            </div>
            <div class="pages-grid" id="browsePagesGrid"></div>
        </div>

        <div class="tool-panel" id="panelCompress">
            <div class="form-group">
                <label id="lblCompressLevel">مستوى الضغط:</label>
                <select id="compressQuality">
                    <option value="0.75" id="optCompNormal">متوازن (جودة جيدة - حجم أقل)</option>
                    <option value="0.5" id="optCompHigh">قوي (أصغر حجم ممكن)</option>
                </select>
            </div>
            <button class="btn-action" onclick="runCompression()" id="btnRunCompress">ضغط الملف</button>
        </div>

        <div class="tool-panel" id="panelWatermark">
            <div class="form-group">
                <label id="lblWatermarkText">النص:</label>
                <input type="text" id="watermarkInput" placeholder="مثال: سري / CONFIDENTIAL" />
            </div>
            <button class="btn-action" onclick="runWatermark()" id="btnRunWatermark">إضافة العلامة المائية</button>
        </div>

        <div class="tool-panel" id="panelRotate">
            <div class="form-group">
                <label id="lblRotateDeg">زاوية التدوير:</label>
                <select id="rotateAngle">
                    <option value="90">90°</option>
                    <option value="180">180°</option>
                    <option value="270">270°</option>
                </select>
            </div>
            <button class="btn-action" onclick="runRotate()" id="btnRunRotate">تدوير الصفحات</button>
        </div>

        <div class="tool-panel" id="panelExtract">
            <div class="form-group">
                <label id="lblExtractPages">الصفحات المطلوبة (مثال: 1, 3-5):</label>
                <input type="text" id="extractPagesInput" placeholder="1-3" />
            </div>
            <button class="btn-action" onclick="runExtract()" id="btnRunExtract">استخراج الصفحات</button>
        </div>

        <div class="tool-panel" id="panelNumbers">
            <button class="btn-action" onclick="runPageNumbers()" id="btnRunNumbers">إضافة أرقام الصفحات أسفل الملف</button>
        </div>

        <div class="tool-panel" id="panelMerge">
            <div class="form-group">
                <label id="lblMergeFiles">اختر ملفات إضافية للدمج مع الملف الحالي:</label>
                <input type="file" id="mergeFileInput" accept="application/pdf" multiple />
            </div>
            <button class="btn-action" onclick="runMerge()" id="btnRunMerge">دمج الكل</button>
        </div>

        <div class="comparison-card" id="comparisonCard">
            <div class="comparison-header">
                <div style="font-weight: 700; font-size: 14px;" id="lblPreviewResult">المعاينة والنتيجة</div>
                <div id="compressionRatioBadge" class="stats-badge"></div>
            </div>
            <div class="comparison-views">
                <div class="view-col">
                    <h4 id="lblBefore">قبل</h4>
                    <div class="view-gallery" id="beforeGallery"></div>
                    <div class="stats-badge" id="beforeMeta">-</div>
                </div>
                <div class="view-col">
                    <h4 id="lblAfter">بعد</h4>
                    <div class="view-gallery" id="afterGallery"></div>
                    <div class="stats-badge" id="afterMeta">-</div>
                </div>
            </div>
            <div class="download-group">
                <button class="btn-action" style="background: var(--accent-green);" onclick="downloadResult()" id="btnDownload">تنزيل الملف</button>
                <button class="btn-action btn-outline" onclick="applyAsActiveFile()" id="btnContinueEdit">متابعة التعديل على هذا الملف</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="https://linkedin.com/in/mbnq" target="_blank" rel="noopener noreferrer">LinkedIn: mbnq</a>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentLang = 'ar';
        let originalBytes = null;
        let originalFileName = '';
        let originalPageCount = 0;
        let resultPdfBytes = null;
        let activePages = [];

        const i18n = {
            ar: {
                langBtn: 'English',
                appTitle: 'أدوات PDF',
                securityText: 'آمن، معالجة محلية بدون حفظ على السيرفر',
                uploadPrompt: 'اضغط أو اسحب ملف PDF هنا',
                deleteBtn: 'حذف',
                tabBrowse: 'تصفح وحذف',
                tabCompress: 'ضغط',
                tabWatermark: 'علامة مائية',
                tabRotate: 'تدوير',
                tabExtract: 'استخراج',
                tabNumbers: 'ترقيم',
                tabMerge: 'دمج',
                lblSelectPages: 'حدد الصفحات أو احذفها:',
                btnSaveBrowsed: 'حفظ التغييرات',
                lblCompressLevel: 'مستوى الضغط:',
                optCompNormal: 'متوازن (جودة جيدة - حجم أقل)',
                optCompHigh: 'قوي (أصغر حجم ممكن)',
                btnRunCompress: 'ضغط الملف',
                lblWatermarkText: 'النص:',
                btnRunWatermark: 'إضافة العلامة المائية',
                lblRotateDeg: 'زاوية التدوير:',
                btnRunRotate: 'تدوير الصفحات',
                lblExtractPages: 'الصفحات المطلوبة (مثال: 1, 3-5):',
                btnRunExtract: 'استخراج الصفحات',
                btnRunNumbers: 'إضافة أرقام الصفحات أسفل الملف',
                lblMergeFiles: 'اختر ملفات إضافية للدمج مع الملف الحالي:',
                btnRunMerge: 'دمج الكل',
                lblPreviewResult: 'المعاينة والنتيجة',
                lblBefore: 'قبل',
                lblAfter: 'بعد',
                btnDownload: 'تنزيل الملف',
                btnContinueEdit: 'متابعة التعديل على هذا الملف',
                page: 'صفحة',
                pages: 'صفحات'
            },
            en: {
                langBtn: 'العربية',
                appTitle: 'PDF Tools',
                securityText: 'Secure, 100% Client-Side (No Server Storage)',
                uploadPrompt: 'Tap or drop PDF file here',
                deleteBtn: 'Remove',
                tabBrowse: 'Browse & Delete',
                tabCompress: 'Compress',
                tabWatermark: 'Watermark',
                tabRotate: 'Rotate',
                tabExtract: 'Extract',
                tabNumbers: 'Page Numbers',
                tabMerge: 'Merge',
                lblSelectPages: 'Browse or remove pages:',
                btnSaveBrowsed: 'Save Changes',
                lblCompressLevel: 'Compression Level:',
                optCompNormal: 'Balanced (Good quality - smaller size)',
                optCompHigh: 'Strong (Smallest possible size)',
                btnRunCompress: 'Compress PDF',
                lblWatermarkText: 'Text:',
                btnRunWatermark: 'Apply Watermark',
                lblRotateDeg: 'Rotation Angle:',
                btnRunRotate: 'Rotate Pages',
                lblExtractPages: 'Target pages (e.g. 1, 3-5):',
                btnRunExtract: 'Extract Pages',
                btnRunNumbers: 'Add Page Numbers to Bottom',
                lblMergeFiles: 'Select additional files to merge with current:',
                btnRunMerge: 'Merge All',
                lblPreviewResult: 'Preview & Result',
                lblBefore: 'Before',
                lblAfter: 'After',
                btnDownload: 'Download PDF',
                btnContinueEdit: 'Continue Editing This File',
                page: 'Page',
                pages: 'Pages'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            const t = i18n[currentLang];
            document.getElementById('langSwitch').innerText = t.langBtn;
            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('securityText').innerText = t.securityText;
            document.getElementById('uploadPrompt').innerText = t.uploadPrompt;
            document.getElementById('btnRemoveFile').innerText = t.deleteBtn;
            document.getElementById('tabBrowse').innerText = t.tabBrowse;
            document.getElementById('tabCompress').innerText = t.tabCompress;
            document.getElementById('tabWatermark').innerText = t.tabWatermark;
            document.getElementById('tabRotate').innerText = t.tabRotate;
            document.getElementById('tabExtract').innerText = t.tabExtract;
            document.getElementById('tabNumbers').innerText = t.tabNumbers;
            document.getElementById('tabMerge').innerText = t.tabMerge;
            document.getElementById('lblSelectPages').innerText = t.lblSelectPages;
            document.getElementById('btnSaveBrowsed').innerText = t.btnSaveBrowsed;
            document.getElementById('lblCompressLevel').innerText = t.lblCompressLevel;
            document.getElementById('optCompNormal').innerText = t.optCompNormal;
            document.getElementById('optCompHigh').innerText = t.optCompHigh;
            document.getElementById('btnRunCompress').innerText = t.btnRunCompress;
            document.getElementById('lblWatermarkText').innerText = t.lblWatermarkText;
            document.getElementById('btnRunWatermark').innerText = t.btnRunWatermark;
            document.getElementById('lblRotateDeg').innerText = t.lblRotateDeg;
            document.getElementById('btnRunRotate').innerText = t.btnRunRotate;
            document.getElementById('lblExtractPages').innerText = t.lblExtractPages;
            document.getElementById('btnRunExtract').innerText = t.btnRunExtract;
            document.getElementById('btnRunNumbers').innerText = t.btnRunNumbers;
            document.getElementById('lblMergeFiles').innerText = t.lblMergeFiles;
            document.getElementById('btnRunMerge').innerText = t.btnRunMerge;
            document.getElementById('lblPreviewResult').innerText = t.lblPreviewResult;
            document.getElementById('lblBefore').innerText = t.lblBefore;
            document.getElementById('lblAfter').innerText = t.lblAfter;
            document.getElementById('btnDownload').innerText = t.btnDownload;
            document.getElementById('btnContinueEdit').innerText = t.btnContinueEdit;

            if (originalBytes) updateMetaDisplay();
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalFileName = file.name;
            const buffer = await file.arrayBuffer();
            originalBytes = new Uint8Array(buffer);
            await initFileState();
        });

        async function initFileState() {
            const pdfDoc = await PDFLib.PDFDocument.load(originalBytes);
            originalPageCount = pdfDoc.getPageCount();
            activePages = Array.from({ length: originalPageCount }, (_, i) => i);

            document.getElementById('dropArea').style.display = 'none';
            document.getElementById('activeFileCard').style.display = 'flex';
            document.getElementById('toolTabs').style.display = 'flex';
            document.getElementById('displayFileName').innerText = originalFileName;
            updateMetaDisplay();

            await renderBrowseGrid();
        }

        function updateMetaDisplay() {
            const t = i18n[currentLang];
            const size = (originalBytes.length / (1024 * 1024)).toFixed(2);
            document.getElementById('displayFileMeta').innerText = `${size} MB • ${originalPageCount} ${t.pages}`;
        }

        function resetFile() {
            originalBytes = null;
            resultPdfBytes = null;
            originalPageCount = 0;
            activePages = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('dropArea').style.display = 'block';
            document.getElementById('activeFileCard').style.display = 'none';
            document.getElementById('toolTabs').style.display = 'none';
            document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panelBrowse').classList.add('active');
            document.getElementById('comparisonCard').style.display = 'none';
        }

        function setTool(toolName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tool === toolName));
            document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.remove('active'));
            const target = document.getElementById('panel' + toolName.charAt(0).toUpperCase() + toolName.slice(1));
            if (target) target.classList.add('active');
        }

        async function renderBrowseGrid() {
            const grid = document.getElementById('browsePagesGrid');
            grid.innerHTML = '';
            const loadingTask = pdfjsLib.getDocument({ data: originalBytes.slice() });
            const pdf = await loadingTask.promise;

            for (let i = 0; i < activePages.length; i++) {
                const pageNum = activePages[i] + 1;
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 0.2 });

                const card = document.createElement('div');
                card.className = 'page-card';

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                card.appendChild(canvas);

                const actions = document.createElement('div');
                actions.className = 'page-card-actions';
                actions.innerHTML = `<span>#${pageNum}</span><button class="btn-danger" onclick="removeSinglePage(${i})">✕</button>`;
                card.appendChild(actions);

                grid.appendChild(card);
            }
        }

        function removeSinglePage(index) {
            if (activePages.length <= 1) return;
            activePages.splice(index, 1);
            renderBrowseGrid();
        }

        async function saveBrowsedPdf() {
            const srcDoc = await PDFLib.PDFDocument.load(originalBytes);
            const newDoc = await PDFLib.PDFDocument.create();
            const copied = await newDoc.copyPages(srcDoc, activePages);
            copied.forEach(p => newDoc.addPage(p));
            resultPdfBytes = await newDoc.save();
            await showComparison();
        }

        async function runCompression() {
            const quality = parseFloat(document.getElementById('compressQuality').value);
            const loadingTask = pdfjsLib.getDocument({ data: originalBytes.slice() });
            const pdf = await loadingTask.promise;
            const newDoc = await PDFLib.PDFDocument.create();

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.0 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                const jpegUrl = canvas.toDataURL('image/jpeg', quality);
                const imageBytes = await fetch(jpegUrl).then(res => res.arrayBuffer());
                const img = await newDoc.embedJpg(imageBytes);
                const newPage = newDoc.addPage([viewport.width, viewport.height]);
                newPage.drawImage(img, { x: 0, y: 0, width: viewport.width, height: viewport.height });
            }

            resultPdfBytes = await newDoc.save();
            await showComparison();
        }

        async function runWatermark() {
            const text = document.getElementById('watermarkInput').value.trim() || 'CONFIDENTIAL';
            const pdfDoc = await PDFLib.PDFDocument.load(originalBytes);

            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 600, 300);
            ctx.fillStyle = 'rgba(180, 180, 180, 0.35)';
            ctx.font = 'bold 42px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.translate(300, 150);
            ctx.rotate(-Math.PI / 4);
            ctx.fillText(text, 0, 0);

            const stampPng = await fetch(canvas.toDataURL('image/png')).then(r => r.arrayBuffer());
            const embeddedStamp = await pdfDoc.embedPng(stampPng);

            const pages = pdfDoc.getPages();
            pages.forEach(p => {
                const { width, height } = p.getSize();
                p.drawImage(embeddedStamp, {
                    x: (width - 400) / 2,
                    y: (height - 200) / 2,
                    width: 400,
                    height: 200
                });
            });

            resultPdfBytes = await pdfDoc.save();
            await showComparison();
        }

        async function runRotate() {
            const angle = parseInt(document.getElementById('rotateAngle').value, 10);
            const pdfDoc = await PDFLib.PDFDocument.load(originalBytes);
            pdfDoc.getPages().forEach(p => {
                p.setRotation(PDFLib.degrees((p.getRotation().angle + angle) % 360));
            });
            resultPdfBytes = await pdfDoc.save();
            await showComparison();
        }

        async function runExtract() {
            const input = document.getElementById('extractPagesInput').value.trim();
            if (!input) return;
            const indices = parsePageRange(input, originalPageCount);
            if (!indices.length) return;

            const srcDoc = await PDFLib.PDFDocument.load(originalBytes);
            const newDoc = await PDFLib.PDFDocument.create();
            const copied = await newDoc.copyPages(srcDoc, indices);
            copied.forEach(p => newDoc.addPage(p));

            resultPdfBytes = await newDoc.save();
            await showComparison();
        }

        async function runPageNumbers() {
            const pdfDoc = await PDFLib.PDFDocument.load(originalBytes);
            const pages = pdfDoc.getPages();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

            pages.forEach((p, idx) => {
                const { width } = p.getSize();
                const str = `${idx + 1} / ${pages.length}`;
                p.drawText(str, {
                    x: width / 2 - 15,
                    y: 20,
                    size: 10,
                    font: font,
                    color: PDFLib.rgb(0.3, 0.3, 0.3)
                });
            });

            resultPdfBytes = await pdfDoc.save();
            await showComparison();
        }

        async function runMerge() {
            const files = document.getElementById('mergeFileInput').files;
            if (!files.length) return;

            const mergedDoc = await PDFLib.PDFDocument.load(originalBytes);
            for (let f of files) {
                const buff = await f.arrayBuffer();
                const doc = await PDFLib.PDFDocument.load(buff);
                const copied = await mergedDoc.copyPages(doc, doc.getPageIndices());
                copied.forEach(p => mergedDoc.addPage(p));
            }

            resultPdfBytes = await mergedDoc.save();
            await showComparison();
        }

        function parsePageRange(str, max) {
            const pages = new Set();
            str.split(',').forEach(part => {
                const range = part.trim().split('-');
                if (range.length === 2) {
                    const start = parseInt(range[0]), end = parseInt(range[1]);
                    for (let i = start; i <= end; i++) if (i >= 1 && i <= max) pages.add(i - 1);
                } else {
                    const p = parseInt(part.trim());
                    if (p >= 1 && p <= max) pages.add(p - 1);
                }
            });
            return Array.from(pages);
        }

        async function showComparison() {
            const card = document.getElementById('comparisonCard');
            card.style.display = 'block';

            await fillGallery('beforeGallery', originalBytes);
            await fillGallery('afterGallery', resultPdfBytes);

            const beforeSize = (originalBytes.length / 1024).toFixed(1);
            const afterSize = (resultPdfBytes.length / 1024).toFixed(1);

            const resDoc = await PDFLib.PDFDocument.load(resultPdfBytes);
            const resCount = resDoc.getPageCount();

            const t = i18n[currentLang];
            document.getElementById('beforeMeta').innerText = `${beforeSize} KB • ${originalPageCount} ${t.pages}`;
            document.getElementById('afterMeta').innerText = `${afterSize} KB • ${resCount} ${t.pages}`;

            const ratio = (((resultPdfBytes.length - originalBytes.length) / originalBytes.length) * 100).toFixed(0);
            const badge = document.getElementById('compressionRatioBadge');
            badge.innerText = `${ratio > 0 ? '+' : ''}${ratio}%`;
            badge.style.color = ratio <= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function fillGallery(elemId, bytes) {
            const container = document.getElementById(elemId);
            container.innerHTML = '';
            const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
            const pdf = await loadingTask.promise;
            const count = Math.min(pdf.numPages, 4);

            for (let i = 1; i <= count; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.2 });

                const wrapper = document.createElement('div');
                wrapper.className = 'thumb-wrapper';

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                wrapper.appendChild(canvas);
                container.appendChild(wrapper);
            }
        }

        function downloadResult() {
            if (!resultPdfBytes) return;
            const blob = new Blob([resultPdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `edited_${originalFileName || 'document.pdf'}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function applyAsActiveFile() {
            if (!resultPdfBytes) return;
            originalBytes = resultPdfBytes;
            resultPdfBytes = null;
            await initFileState();
            document.getElementById('comparisonCard').style.display = 'none';
        }
    </script>
</body>
